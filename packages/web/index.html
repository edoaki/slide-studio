<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title></title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app" data-testid="app">
      <header class="app-header">
        <div class="brand">
          <span id="brand-mark" class="brand-mark" aria-hidden="true"></span>
          <div class="brand-copy">
            <h1 id="app-name" class="app-name"></h1>
            <p id="app-subtitle" class="app-subtitle"></p>
          </div>
        </div>

        <div class="header-actions">
          <span
            id="save-status"
            class="status-pill"
            data-testid="save-status"
            aria-live="polite"
          ></span>
          <button
            id="save-button"
            class="button button-primary"
            type="button"
            data-testid="save"
            disabled
          ></button>
          <div id="export-group" class="button-group" role="group">
            <button
              id="export-html"
              class="button"
              type="button"
              data-testid="export-html"
              disabled
            ></button>
            <button
              id="export-pdf"
              class="button"
              type="button"
              data-testid="export-pdf"
              disabled
            ></button>
          </div>
          <span id="export-status" class="export-status" aria-live="polite"></span>
        </div>
      </header>

      <div id="app-error" class="app-error" role="alert" hidden>
        <span id="app-error-text" class="app-error-text"></span>
        <button id="app-error-retry" class="button button-small" type="button"></button>
      </div>

      <div class="app-body">
        <aside id="sidebar" class="sidebar">
          <section class="sidebar-section">
            <div class="section-heading">
              <span id="workspace-label"></span>
            </div>
            <button
              id="select-workspace"
              class="button button-wide"
              type="button"
              data-testid="select-workspace"
            ></button>
            <div
              id="workspace-path"
              class="workspace-path"
              data-testid="workspace-path"
            ></div>
            <div id="workspace-status" class="inline-note" aria-live="polite" hidden></div>
          </section>

          <section class="sidebar-section sidebar-decks">
            <div class="section-heading">
              <span id="deck-label"></span>
              <span id="deck-count" class="count"></span>
            </div>

            <form id="new-deck-form" class="new-deck" autocomplete="off">
              <label id="new-title-label" class="sr-only" for="new-title"></label>
              <input
                id="new-title"
                class="text-input"
                data-testid="new-title"
                type="text"
                autocomplete="off"
              />
              <button
                id="new-deck"
                class="button button-compact"
                data-testid="new-deck"
                type="submit"
              ></button>
            </form>
            <div id="new-deck-error" class="field-error" role="alert" hidden></div>

            <ul id="deck-list" class="deck-list" data-testid="deck-list"></ul>
          </section>
        </aside>

        <main class="main">
          <div class="split">
            <section class="pane editor-pane" aria-labelledby="editor-label">
              <div class="pane-header">
                <div class="pane-title">
                  <h2 id="editor-label"></h2>
                  <span id="active-deck-title" class="pane-subtitle"></span>
                </div>
                <span id="editor-note" class="pane-note" aria-live="polite"></span>
              </div>
              <textarea
                id="source-editor"
                class="source-editor"
                data-testid="source-editor"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                autocorrect="off"
                wrap="off"
              ></textarea>
            </section>

            <section class="pane preview-pane" aria-labelledby="preview-label">
              <div class="pane-header">
                <h2 id="preview-label"></h2>
                <span
                  id="preview-status"
                  class="status-pill status-small"
                  data-testid="preview-status"
                  aria-live="polite"
                ></span>
              </div>

              <div id="preview-stage" class="preview-stage">
                <div id="preview-frame-wrap" class="preview-frame-wrap" hidden>
                  <iframe
                    id="preview-frame"
                    class="preview-frame"
                    data-testid="preview-frame"
                    sandbox="allow-scripts allow-same-origin"
                    referrerpolicy="no-referrer"
                    hidden
                  ></iframe>
                </div>
                <div
                  id="preview-placeholder"
                  class="preview-placeholder"
                  aria-live="polite"
                ></div>
              </div>

              <div id="diagnostics" class="diagnostics" hidden>
                <div class="diagnostics-heading">
                  <span id="diagnostics-title"></span>
                  <span id="diagnostics-count" class="count"></span>
                </div>
                <ul id="diagnostics-list" class="diagnostics-list"></ul>
              </div>

              <div class="pages-bar">
                <button
                  id="previous-slide"
                  class="button button-narrow"
                  type="button"
                  data-testid="previous-slide"
                  disabled
                ></button>
                <select
                  id="slide-select"
                  class="slide-select"
                  data-testid="slide-select"
                  disabled
                ></select>
                <button
                  id="next-slide"
                  class="button button-narrow"
                  type="button"
                  data-testid="next-slide"
                  disabled
                ></button>
                <span id="page-indicator" class="page-indicator"></span>
              </div>
            </section>
          </div>
        </main>
      </div>

      <footer class="app-footer">
        <span id="notice-trial"></span>
        <span class="footer-separator" aria-hidden="true">·</span>
        <span id="notice-unavailable"></span>
        <span class="footer-separator" aria-hidden="true">·</span>
        <span id="notice-pdf"></span>
      </footer>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
