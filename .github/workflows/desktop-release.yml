name: desktop-release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
  build:
    needs: version
    uses: ./.github/workflows/desktop-build.yml
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: slide-studio-*
          path: artifacts
      - name: Verify all installers and create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          version="${GITHUB_REF_NAME#v}"
          for target in mac-arm64 mac-x64 win-x64; do
            dir="artifacts/slide-studio-$target"
            (cd "$dir" && sha256sum --check SHA256SUMS)
            file="Slide-Studio-$version-$target"
            if [[ "$target" == win-x64 ]]; then file+="-Setup.exe"; else file+=".dmg"; fi
            cp "$dir/$file" release/
          done
          (cd release && sha256sum *.dmg *.exe > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Slide Studio $version" --generate-notes
