name: desktop-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Verify release version
        shell: bash
        run: |
          node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if(process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${p.version}`) throw Error("Tag and package version must match")'
      - run: npm test
      - name: Stage macOS Pandoc for both architectures
        if: runner.os == 'macOS'
        run: |
          node scripts/package-desktop.mjs --mac --arch arm64 --stage-only
          node scripts/package-desktop.mjs --mac --arch x64 --stage-only
      - name: Stage Windows Pandoc
        if: runner.os == 'Windows'
        run: node scripts/package-desktop.mjs --win --arch x64 --stage-only
      - name: Build signed macOS release into draft
        if: runner.os == 'macOS'
        env:
          SLIDE_STUDIO_RELEASE: '1'
        run: npx electron-builder --config scripts/electron-builder.config.cjs --mac --arm64 --x64 --publish always
      - name: Build signed Windows release into draft
        if: runner.os == 'Windows'
        env:
          SLIDE_STUDIO_RELEASE: '1'
        run: npx electron-builder --config scripts/electron-builder.config.cjs --win --x64 --publish always
