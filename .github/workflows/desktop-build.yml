name: desktop-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64 DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript and assets
        run: npm run build

      - name: Fetch native Pandoc
        run: npm run setup:pandoc

      - name: Run tests
        run: npm test

      - name: Build macOS DMG (ad-hoc, no publish)
        run: npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slide-studio-mac-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.blockmap
            release/SHA256SUMS

  windows:
    name: Windows x64 NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript and assets
        run: npm run build

      - name: Fetch native Pandoc
        run: npm run setup:pandoc

      - name: Run tests
        run: npm test

      - name: Build Windows NSIS installer (unsigned, no publish)
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slide-studio-win-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS
