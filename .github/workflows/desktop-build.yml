name: desktop-build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }} DMG
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript and assets
        run: npm run build

      - name: Fetch native Pandoc
        run: npm run setup:pandoc

      - name: Run tests
        run: npm test

      - name: Build macOS DMG (ad-hoc, no publish)
        run: node scripts/package-desktop.mjs --mac --arch ${{ matrix.arch }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slide-studio-mac-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.blockmap
            release/SHA256SUMS

  windows:
    name: Windows x64 NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript and assets
        run: npm run build

      - name: Fetch native Pandoc
        run: npm run setup:pandoc

      - name: Check Windows packaging and manual updates
        run: node --test dist/tests/packaging/package-desktop.test.js dist/tests/desktop/updates.test.js

      - name: Build Windows NSIS installer (unsigned, no publish)
        run: node scripts/package-desktop.mjs --win --arch x64

      - name: Install and start the packaged Windows app
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/*.exe -ErrorAction Stop).FullName
          $target = Join-Path $env:RUNNER_TEMP SlideStudio
          $install = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $env:SLIDE_STUDIO_ELECTRON_HOME = Join-Path $env:RUNNER_TEMP studio-profile
          $stderr = Join-Path $env:RUNNER_TEMP studio-stderr.log
          $app = Start-Process "$target/Slide Studio.exe" -ArgumentList "--studio-browser", "--no-browser", "--port", "0" -RedirectStandardError $stderr -PassThru
          try {
            $bootstrap = Join-Path $env:SLIDE_STUDIO_ELECTRON_HOME browser-connection.html
            for ($i = 0; $i -lt 60 -and !(Test-Path $bootstrap); $i++) {
              if ($app.HasExited) { throw "App exited with $($app.ExitCode): $(Get-Content $stderr -Raw)" }
              Start-Sleep -Seconds 1
            }
            $url = [regex]::Match((Get-Content $bootstrap -Raw -ErrorAction Stop), 'href="([^"]+)"').Groups[1].Value
            if ((Invoke-WebRequest -Uri $url).StatusCode -ne 200) { throw "Editor did not start" }
          } finally { if (!$app.HasExited) { Stop-Process -Id $app.Id } }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slide-studio-win-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS
