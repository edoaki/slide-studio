name: verify

on:
  pull_request:
  push:
    branches: [main, migration/electron]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run setup:pandoc
      - run: npm test
        env:
          SLIDE_STUDIO_PANDOC: ${{ github.workspace }}/resources/pandoc/bin/pandoc
